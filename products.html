<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>المنتجات | سان ستور</title>
  <link rel="icon" href="assets/logo/logo.png">
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>

<div id="site-header" data-active="products"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / المنتجات</div>
      <h1>كل المنتجات</h1>
      <p>تصفّح مجموعتنا الكاملة من مستلزمات الحيوانات الأليفة، وابحث أو صفِّ النتائج حسب القسم والسعر.</p>
    </div>
  </section>

  <section class="section" style="padding-top:10px;">
    <div class="container">

      <div class="shop-toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
          <span></span>
        </div>
        <select id="sortSelect" class="sort-select">
          <option value="default">الأحدث</option>
          <option value="price-asc">السعر: من الأقل للأعلى</option>
          <option value="price-desc">السعر: من الأعلى للأقل</option>
          <option value="name">الاسم (أ-ي)</option>
        </select>
        <span id="resultCount" style="font-size:.85rem;color:var(--ink-600);white-space:nowrap;"></span>
      </div>

      <div class="shop-layout">
        <aside class="filter-panel">
          <div>
            <h4>الأقسام</h4>
            <div class="cat-list" id="filterCategories"></div>
          </div>
          <div>
            <h4>نطاق السعر (د.ع)</h4>
            <div class="range-row">
              <input type="number" id="priceMin" placeholder="من">
              <span>—</span>
              <input type="number" id="priceMax" placeholder="إلى">
            </div>
          </div>
        </aside>

        <div class="product-grid" id="shopGrid"></div>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js?v=8"></script>
<script src="js/whatsapp.js?v=4"></script>
<script src="js/app.js?v=22"></script>
<script src="js/products.js?v=30"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const shopSearchSpan = document.querySelector(".shop-toolbar .search-box span");
    if (shopSearchSpan) {
        shopSearchSpan.innerHTML = iconSvg("search");
    }
  });
</script>
</body>
</html>
